<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        fieldset{
            width:30%;
            height: 50%;
            /* padding: 20px; */
            background-color: rgb(7, 7, 7);
            color: rgb(2, 2, 2);
            font-size: 20px;
            /* text-align:left; */
            padding: 20px 50px;
        }
        legend{
            background-color: rgb(246, 246, 246);
            color:red;
            font-size: 20px;
            border-radius: 5px;
            color: rgb(0, 0, 0);
            padding: 5px;
        }
        .name,.email,.password,.username{
            width:100%;
            height: 30px;
            border-radius: 5px;
            border-style: none;
            /* box-sizing: border-box; */

        }
        label{
            color: #efeb74;
            
        }
        .submit{
            width: 50%;
            padding: 5px;
            box-sizing: border-box;
            border-radius: 5px;
            font-size: 1rem;
            background-color:  #efeb74;;

        }
    </style>
</head>
<body>    
    <center> 
            <h2>Login Form</h2>
            <form action="">
                <fieldset>
                    <legend>Pattern validation</legend>
                    <label for="name">Name </label>
                    <input type="text" placeholder="enter your name" pattern="[A-Za-z]{3,12}" title="only upper and lower alphabets allowed and min 3 char" class="name" id="name">
                    <br> <br>
                    <label for="email">Email </label>
                    <input type="text" placeholder="enter your Email" pattern="[a-z\d\-_]{3,20}[@][a-z]{5}[\.][a-z]{2,3}" title="please enter gmail pattern" class="email" id="email">
                    <br><br>
                    <label for="username"> Username </label>
                    <input type="text" placeholder="enter your Username" pattern="[A-Za-z\d_\-\.@]{4,10}" class="username" id="username">
                    <br> <br>
                    <label for="password">Password </label>
                    <input type="text" placeholder="enter your password" pattern="[\w@#\$%\^&\*]{6,}" class="password" id="password">
                    <br> <br>
                    <div><input type="submit" class="submit" style="text-align: center;"></div>
                </fieldset>
            </form>
</center>
</body>
</html>
